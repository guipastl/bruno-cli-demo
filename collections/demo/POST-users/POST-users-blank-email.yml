info:
  name: POST-users-blank-email
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/users"
  headers:
    - name: Authorization
      value: Bearer {{process.env.ACCESS_TOKEN}}
  body:
    type: json
    data: |-
      {
        "name": "{{$randomFullName}}",
        "gender": "male",
        "status": "active"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.body[0].field
      operator: eq
      value: email
    - expression: res.body[0].message
      operator: eq
      value: can't be blank

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
