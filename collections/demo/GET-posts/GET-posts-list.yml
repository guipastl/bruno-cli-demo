info:
  name: GET-posts-list
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}/posts"
  headers:
    - name: Authorization
      value: Bearer {{process.env.ACCESS_TOKEN}}
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: length
      value: "10"
    - expression: res.body[0].id
      operator: isNumber
    - expression: res.body[0].user_id
      operator: isNumber
    - expression: res.body[0].title
      operator: isString
    - expression: res.body[0].body
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
