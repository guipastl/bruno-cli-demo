info:
  name: GET-users-by-id
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/users/8564330"
  headers:
    - name: Authorization
      value: Bearer {{process.env.ACCESS_TOKEN}}
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: eq
      value: "8564330"
    - expression: res.body.name
      operator: eq
      value: Ananta Pilla
    - expression: res.body.email
      operator: eq
      value: pilla_ananta@breitenberg-gusikowski.test
    - expression: res.body.gender
      operator: eq
      value: male
    - expression: res.body.status
      operator: eq
      value: active

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
