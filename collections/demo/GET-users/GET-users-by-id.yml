info:
  name: GET-users-by-id
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/users/{{userId}}"
  headers:
    - name: Authorization
      value: Bearer {{process.env.ACCESS_TOKEN}}
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: isNumber
    - expression: res.body.name
      operator: isString
    - expression: res.body.email
      operator: isString
    - expression: res.body.gender
      operator: isString
    - expression: res.body.status
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
