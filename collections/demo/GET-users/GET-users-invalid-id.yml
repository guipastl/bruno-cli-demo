info:
  name: GET-users-invalid-id
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/users/abc123"
  headers:
    - name: Authorization
      value: Bearer {{process.env.ACCESS_TOKEN}}
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.message
      operator: eq
      value: Resource not found

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
