info:
  name: GET-users-list
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}/users"
  headers:
    - name: Authorization
      value: Bearer {{process.env.ACCESS_TOKEN}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();
        bru.setEnvVar("userId", data[0].id);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: length
      value: "10"
    - expression: res.body[0].id
      operator: isNumber
    - expression: res.body[0].name
      operator: isString
    - expression: res.body[0].email
      operator: isString
    - expression: res.body[0].gender
      operator: isString
    - expression: res.body[0].status
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
