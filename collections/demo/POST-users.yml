info:
  name: POST-users
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/users"
  headers:
    - name: Authorization
      value: Bearer {{process.env.ACCESS_TOKEN}}
  body:
    type: json
    data: |-
      {
        "name": "{{$randomFullName}}",
        "email": "{{$randomEmail}}",
        "gender": "male",
        "status": "active"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.id
      operator: isNumber

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
