info:
  name: GET-todos-list
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/todos"
  headers:
    - name: Authorization
      value: Bearer {{process.env.ACCESS_TOKEN}}
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: length
      value: "10"
    - expression: res.body[0].id
      operator: isNumber
    - expression: res.body[0].user_id
      operator: isNumber
    - expression: res.body[0].title
      operator: isString
    - expression: res.body[0].due_on
      operator: endsWith
      value: T00:00:00.000+05:30
    - expression: res.body[0].status
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
